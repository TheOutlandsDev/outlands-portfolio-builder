name: Source and application checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  application:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PORTFOLIO_REQUIRE_TK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned runtime and test dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Verify exact reviewed source
        run: python -B source_check.py
      - name: Run Windows engine and Tk tests
        if: runner.os == 'Windows'
        run: python -B -m unittest discover -s tests -v
      - name: Run Ubuntu engine and Tk tests
        if: runner.os == 'Linux'
        run: xvfb-run -a python -B -m unittest discover -s tests -v
      - name: Capture fictional Windows review window
        if: runner.os == 'Windows' && matrix.python == '3.12' && github.event_name == 'pull_request'
        run: python -B tests/windows_visual_capture.py
      - name: Preserve fictional Windows review captures
        if: always() && runner.os == 'Windows' && matrix.python == '3.12' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: windows-review-${{ github.run_id }}
          path: ${{ runner.temp }}/portfolio-review-capture/
          if-no-files-found: error
          retention-days: 3
      - name: Export and independently verify a generated demo
        run: |
          python -B portfolio.py --demo --check-evidence --output ../ci-demo
          python -B portfolio.py --verify ../ci-demo
      - name: Check dated PyPI runtime advisories
        run: python -B check_advisories.py
